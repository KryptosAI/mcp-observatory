name: "MCP Observatory"
description: "Test your MCP servers for breaking changes, security issues, and schema drift."
branding:
  icon: "shield"
  color: "blue"

inputs:
  command:
    description: "Server command to test (e.g., 'npx -y @modelcontextprotocol/server-filesystem .')"
    required: false
  target:
    description: "Path to a target config JSON file (alternative to command)"
    required: false
  targets:
    description: "Path to MCP config file for multi-server matrix scan (scans all servers, generates matrix comment)"
    required: false
  baseline:
    description: "Path to a baseline cassette file for regression verification"
    required: false
  deep:
    description: "Also invoke safe tools to verify they execute"
    required: false
    default: "false"
  security:
    description: "Run security analysis on tool schemas"
    required: false
    default: "false"
  fail-on-regression:
    description: "Fail the action if the server has issues"
    required: false
    default: "true"
  fail-on-baseline-drift:
    description: "Fail the action if baseline verification detects drift"
    required: false
    default: "true"
  comment-on-pr:
    description: "Post a report as a PR comment"
    required: false
    default: "true"
  set-status:
    description: "Set a commit status check (green/red) on the HEAD SHA"
    required: false
    default: "true"
  github-token:
    description: "GitHub token for PR comments and commit statuses"
    required: false
    default: ${{ github.token }}
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"
  package-version:
    description: "MCP Observatory npm version to install. Use 'latest' for the newest release or pin a version for reproducible CI."
    required: false
    default: "latest"

outputs:
  gate:
    description: "Overall result: 'pass' or 'fail'"
    value: ${{ steps.run.outputs.gate }}
  artifact-path:
    description: "Path to the run artifact JSON file"
    value: ${{ steps.run.outputs.artifact_path }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install MCP Observatory
      shell: bash
      run: npm install -g "@kryptosai/mcp-observatory@${{ inputs.package-version }}"

    - name: Run Observatory checks
      id: run
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_TARGETS: ${{ inputs.targets }}
        INPUT_DEEP: ${{ inputs.deep }}
        INPUT_SECURITY: ${{ inputs.security }}
      run: |
        ARTIFACT_DIR="${RUNNER_TEMP}/observatory"
        mkdir -p "$ARTIFACT_DIR"

        # Multi-server matrix scan
        if [ -n "$INPUT_TARGETS" ]; then
          if [ "$INPUT_DEEP" = "true" ]; then
            SCAN_ARRAY=(mcp-observatory scan deep --config "$INPUT_TARGETS")
          else
            SCAN_ARRAY=(mcp-observatory scan --config "$INPUT_TARGETS")
          fi
          if [ "$INPUT_SECURITY" = "true" ]; then
            SCAN_ARRAY+=(--security)
          fi
          SCAN_ARRAY+=(--no-color)

          set +e
          "${SCAN_ARRAY[@]}" 2>&1 | tee "${ARTIFACT_DIR}/output.txt"
          set -e

          # Collect all artifacts and determine gate
          GATE="pass"
          for f in .mcp-observatory/runs/*.json; do
            [ -f "$f" ] || continue
            FILE_GATE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$f','utf8')).gate)" 2>/dev/null || echo "unknown")
            if [ "$FILE_GATE" = "fail" ]; then
              GATE="fail"
            fi
          done
          echo "gate=${GATE}" >> "$GITHUB_OUTPUT"
          echo "artifact_path=${ARTIFACT_DIR}" >> "$GITHUB_OUTPUT"

          # Generate CI report for PR comment
          mcp-observatory ci-report --format markdown --no-color > "${ARTIFACT_DIR}/report.md" 2>/dev/null || true

        # Single-server scan
        else
          CMD_ARRAY=()
          if [ -n "$INPUT_TARGET" ]; then
            CMD_ARRAY=(mcp-observatory test --target "$INPUT_TARGET")
          elif [ -n "$INPUT_COMMAND" ]; then
            mapfile -t COMMAND_PARTS < <(node -e 'const input=process.env.INPUT_COMMAND||"";const parts=[];let current="",quote=null,escaping=false;for(const char of input){if(escaping){current+=char;escaping=false;continue}if(char==="\\"){escaping=true;continue}if(quote){if(char===quote)quote=null;else current+=char;continue}if(char==="\""||char===String.fromCharCode(39)){quote=char;continue}if(/\s/.test(char)){if(current.length>0){parts.push(current);current=""}continue}current+=char}if(escaping)current+="\\";if(current.length>0)parts.push(current);for(const part of parts)console.log(part)')
            CMD_ARRAY=(mcp-observatory test "${COMMAND_PARTS[@]}")
          else
            echo "::error::Either 'command', 'target', or 'targets' input is required"
            exit 1
          fi

          if [ "$INPUT_DEEP" = "true" ]; then
            CMD_ARRAY+=(--deep)
          fi
          if [ "$INPUT_SECURITY" = "true" ]; then
            CMD_ARRAY+=(--security)
          fi
          CMD_ARRAY+=(--no-color)

          set +e
          "${CMD_ARRAY[@]}" 2>&1 | tee "${ARTIFACT_DIR}/output.txt"
          set -e

          ARTIFACT_PATH=$(find .mcp-observatory/runs -name "*.json" -type f 2>/dev/null | sort | tail -1)
          if [ -n "$ARTIFACT_PATH" ]; then
            cp "$ARTIFACT_PATH" "${ARTIFACT_DIR}/run.json"
            echo "artifact_path=${ARTIFACT_DIR}/run.json" >> "$GITHUB_OUTPUT"
            GATE=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('${ARTIFACT_DIR}/run.json','utf8')); console.log(d.gate)" 2>/dev/null || echo "unknown")
            echo "gate=${GATE}" >> "$GITHUB_OUTPUT"
          else
            echo "gate=fail" >> "$GITHUB_OUTPUT"
            echo "artifact_path=" >> "$GITHUB_OUTPUT"
          fi

          # Generate PR comment report
          if [ -n "$ARTIFACT_PATH" ]; then
            mcp-observatory report --run "$ARTIFACT_PATH" --format pr-comment --no-color > "${ARTIFACT_DIR}/report.md" 2>/dev/null || true
          fi
        fi

    - name: Verify against baseline
      if: inputs.baseline != ''
      shell: bash
      env:
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_FAIL_ON_BASELINE_DRIFT: ${{ inputs.fail-on-baseline-drift }}
      run: |
        VERIFY_ARRAY=(mcp-observatory verify "$INPUT_BASELINE")
        if [ -n "$INPUT_TARGET" ]; then
          VERIFY_ARRAY+=(--target "$INPUT_TARGET")
        elif [ -n "$INPUT_COMMAND" ]; then
          read -r -a COMMAND_PARTS <<< "$INPUT_COMMAND"
          VERIFY_ARRAY+=("${COMMAND_PARTS[@]}")
        fi
        VERIFY_ARRAY+=(--no-color)

        set +e
        "${VERIFY_ARRAY[@]}" 2>&1 | tee "${RUNNER_TEMP}/observatory/verify.txt"
        VERIFY_EXIT=$?
        set -e

        if [ $VERIFY_EXIT -ne 0 ]; then
          echo "::warning::Baseline verification detected changes"
          if [ "$INPUT_FAIL_ON_BASELINE_DRIFT" = "true" ]; then
            echo "::error::Baseline verification failed"
            exit $VERIFY_EXIT
          fi
        fi

    - name: Set commit status
      if: inputs.set-status == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GATE: ${{ steps.run.outputs.gate }}
      run: |
        STATE="success"
        DESC="All clear"
        if [ "$GATE" = "fail" ]; then
          STATE="failure"
          DESC="Issues detected"
        fi
        gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
          -f state="$STATE" \
          -f description="$DESC" \
          -f context="MCP Observatory" \
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          2>/dev/null || echo "::warning::Could not set commit status"

    - name: Comment on PR
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_REPO: ${{ github.repository }}
      run: |
        REPORT_FILE="${RUNNER_TEMP}/observatory/report.md"

        if [ ! -f "$REPORT_FILE" ]; then
          echo "No report file found, skipping PR comment"
          exit 0
        fi
        if [ ! -s "$REPORT_FILE" ]; then
          echo "Report file is empty, skipping PR comment"
          exit 0
        fi

        COMMENT_FILE="${RUNNER_TEMP}/observatory/comment.md"
        cp "$REPORT_FILE" "$COMMENT_FILE"

        # Use --body-file to avoid shell injection via report content
        gh pr comment "$PR_NUMBER" \
          --repo "$GH_REPO" \
          --body-file "$COMMENT_FILE" \
          --edit-last 2>/dev/null || \
        gh pr comment "$PR_NUMBER" \
          --repo "$GH_REPO" \
          --body-file "$COMMENT_FILE" || \
        echo "::warning::Could not post PR comment; GitHub token may be read-only for forked pull requests"

    - name: Check gate
      if: inputs.fail-on-regression == 'true' && steps.run.outputs.gate == 'fail'
      shell: bash
      run: |
        echo "::error::MCP Observatory detected issues (gate: fail)"
        exit 1
