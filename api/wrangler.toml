name = "mcp-observatory-api"
main = "src/worker.ts"
compatibility_date = "2025-03-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[kv_namespaces]]
binding = "SCAN_CACHE"
id = "0318a3fd6f08482f9194b7e22ccd7b24"

# For local dev, wrangler will create a local KV automatically.
# To create the production namespace:
#   wrangler kv namespace create SCAN_CACHE
# Then paste the returned id above.
#
# Hosted artifact uploads require a pilot token:
#   wrangler secret put CLOUD_UPLOAD_TOKEN
