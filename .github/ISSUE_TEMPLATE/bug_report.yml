name: Bug report
description: Report a defect with clear evidence and reproduction steps.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include commands, target config, and the smallest artifact that proves the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Artifact snippets
      description: Paste the smallest relevant artifact or report excerpt.
