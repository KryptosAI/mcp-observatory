name: MCP workflow improvement
description: Suggest an improvement to free MCP scanning, CI, reports, or ClearFrame task preparation.
title: "[Workflow] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: All Observatory features are MIT licensed. Share only public or fictional examples; omit credentials and private customer data.
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: Include the command, expected behavior, and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction
      description: An optional public target or minimal fixture that needs no secrets.
