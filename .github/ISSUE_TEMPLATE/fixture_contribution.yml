name: Fixture contribution
description: Propose a new deterministic fixture case for reproducible compatibility evidence.
title: "[Fixture]: "
labels: ["fixtures"]
body:
  - type: input
    id: capability
    attributes:
      label: Capability
      description: tools, prompts, resources, semantics, or another future capability
    validations:
      required: true
  - type: textarea
    id: case
    attributes:
      label: Case description
      description: What interoperability edge or regression does this fixture prove?
    validations:
      required: true
  - type: textarea
    id: determinism
    attributes:
      label: Determinism plan
      description: Why will this fixture stay stable across runs?
    validations:
      required: true
