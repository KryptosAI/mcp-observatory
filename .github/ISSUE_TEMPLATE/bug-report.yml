name: Bug report
description: Report a reproducible MCP Observatory defect.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private MCP schemas, customer data, or security vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command, expected result, and actual result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MCP Observatory version
      placeholder: 1.44.1
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [macOS, Linux, Windows, GitHub Actions, Other CI]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal safe reproduction
      description: Provide a public, non-destructive command or fixture.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted output
      render: shell
