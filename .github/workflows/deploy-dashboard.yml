name: Deploy dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate dashboard
        run: node scripts/validate-dashboard.mjs

      - name: Deploy dashboard to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 385e00f98ceabbee25800bda2756cc75
        run: npx wrangler@4.119.0 pages deploy dashboard --project-name mcp-observatory
