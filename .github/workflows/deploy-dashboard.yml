name: Deploy dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, dashboard-deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy dashboard to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 385e00f98ceabbee25800bda2756cc75
        run: npx wrangler@4.119.0 pages deploy dashboard --project-name mcp-observatory
