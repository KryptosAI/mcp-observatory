name: real-server-matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      - name: Run real-server matrix
        id: matrix
        continue-on-error: true
        timeout-minutes: 10
        env:
          MCP_OBSERVATORY_MATRIX_TIMEOUT_MS: "300000"
        run: npm run integration:real

      - name: Build dashboard
        run: npm run dashboard:build

      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-server-matrix-artifacts
          path: |
            examples/artifacts/*.json
            examples/artifacts/*-report.md
          retention-days: 14

      - name: Commit history update
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add examples/matrix-history.json
          git diff --staged --quiet || git commit -m "Update matrix history [skip ci]"
          git push || echo "::warning::Failed to push matrix history update"

      - name: Skip protected main history push
        if: github.ref == 'refs/heads/main'
        run: echo "::notice::Skipping matrix-history push on protected main; dashboard still uses this run's generated artifacts."

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          publish_branch: gh-pages

      - name: Deploy dashboard to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 385e00f98ceabbee25800bda2756cc75
        run: npx wrangler pages deploy dashboard --project-name mcp-observatory --branch "${{ github.ref_name }}"

      - name: Deploy API Worker
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 385e00f98ceabbee25800bda2756cc75
        run: cd api && npx wrangler deploy

      - name: Fail if matrix found issues
        if: steps.matrix.outcome == 'failure'
        run: |
          echo "::error::Real-server matrix completed with failing target(s). See uploaded artifacts and dashboard output for details."
          exit 1
