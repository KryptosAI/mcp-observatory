name: ci

on:
  push:
    branches: ["main"]
  pull_request_target:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Repository boundary
        run: npm run boundary:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Packed install verification
        run: npm run verify:packed-install

      - name: Validate checked-in artifacts
        run: npm run validate:artifacts

      - name: README smoke test
        run: npm run smoke
