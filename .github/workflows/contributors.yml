name: Contributors

on:
  push:
    branches: [main]
    paths:
      - ".all-contributorsrc"

permissions:
  contents: read

jobs:
  generate:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npx all-contributors-cli generate
      - name: Create PR if changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore: regenerate CONTRIBUTORS.md"
          title: "chore: update contributor list"
          body: "Auto-generated from .all-contributorsrc changes."
          branch: chore/contributors-update
          delete-branch: true
