name: MCP Observatory

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mcp-observatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: KryptosAI/mcp-observatory/action@v0.28.0
        with:
          command: npx -y <server-package>
          deep: true
          security: true
          comment-on-pr: true
